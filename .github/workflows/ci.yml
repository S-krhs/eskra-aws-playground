name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        # npm script 側は systemd の cgroup で上限を掛けるが、runner には user session が無いので
        # turbo を直に呼ぶ
        run: npx turbo run typecheck
      - name: Lint
        run: npm run lint
      # アーカイブは 40MB 超を配布元から取るため、release 定義が変わるまで使い回す
      - name: Restore ffmpeg archive
        uses: actions/cache@v4
        with:
          path: .tmp/layers/ffmpeg-download
          key: ffmpeg-archive-${{ hashFiles('infra/layers/ffmpeg/ffmpeg-release.json') }}
      # ffmpeg の実体を使うテストは layer が無いと skip されるため、test の前にビルドする
      - name: Build ffmpeg layer
        run: npm run build:ffmpeg-layer
      - name: Test
        run: npm run test:ci
      - name: Test summary
        if: always()
        run: npm run test:summary
