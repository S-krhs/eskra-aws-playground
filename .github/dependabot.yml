version: 2

updates:
  # npm workspaces は root の package-lock.json で一括管理する。
  # infra/layers/browser-runtime/nodejs は workspace 外だが独自の package-lock.json を持ち、
  # packages/libs/browser とバージョンを揃える必要があるため同じ block で更新対象にする。
  - package-ecosystem: npm
    directories:
      - "/"
      - "/infra/layers/browser-runtime/nodejs"
    # version update の PR を default branch(main)ではなく develop 向けに作る
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # chromium-bidi は 17.0.2 の後 Chrome のバージョン番号(157.0.8103-45 など)に切り替わり、
      # playwright-core が require する lib/cjs/ を含まなくなったため上げない
      - dependency-name: chromium-bidi
        versions:
          - ">= 100"
    groups:
      # browser 実行依存は root と layer でバージョンがずれると layer-dependencies テストが
      # 落ちるため、group-by で directory をまたいで 1 PR にまとめる。
      # 先に定義した group が優先されるので、major も含めて npm-minor-patch より先に置く。
      browser-runtime:
        patterns:
          - "@sparticuz/chromium"
          - "chromium-bidi"
          - "playwright-core"
        group-by: dependency-name
      # minor / patch はまとめて 1 PR にし、レビュー対象を major に絞る
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
